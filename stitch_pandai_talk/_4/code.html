<body class="bg-background text-on-background min-h-screen pb-24">
<!-- TopAppBar -->
<header class="bg-background text-primary font-headline-lg text-headline-lg docked full-width top-0 border-b border-outline-variant flex justify-between items-center w-full px-container-padding h-16 sticky z-40">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="face">face</span>
<h1 class="font-headline-xl text-headline-xl font-extrabold text-primary tracking-tight">パンダイトーク</h1>
</div>
<button class="hover:opacity-80 transition-opacity active:scale-95 duration-150 ease-in-out">
<span class="material-symbols-outlined text-primary" data-icon="settings">settings</span>
</button>
</header>
<main class="max-w-xl mx-auto px-container-padding py-lg">
<!-- Headline Section -->
<div class="mb-xl">
<h2 class="font-headline-lg text-headline-lg text-primary mb-sm">二択を投稿する</h2>
<p class="font-body-sm text-secondary">みんなが悩む、究極の質問を作成しましょう。</p>
</div>
<!-- Form Section -->
<div class="space-y-xl">
<!-- Question Input -->
<div class="space-y-sm">
<label class="font-label-bold text-label-bold text-primary block">質問内容</label>
<textarea class="w-full min-h-[120px] bg-surface-container-lowest border border-outline px-md py-md rounded-lg font-body-lg text-body-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline-variant" placeholder="例：一生パンしか食べられないとしたら、どっちがいい？"></textarea>
</div>
<!-- Choice Inputs -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="space-y-sm">
<label class="font-label-bold text-label-bold text-primary block">選択肢 A</label>
<input class="w-full bg-surface-container-lowest border-2 border-primary px-md h-14 rounded-lg font-body-lg text-body-lg focus:ring-0 outline-none" placeholder="甘いパン" type="text"/>
</div>
<div class="space-y-sm">
<label class="font-label-bold text-label-bold text-primary block">選択肢 B</label>
<input class="w-full bg-surface-container-lowest border border-outline px-md h-14 rounded-lg font-body-lg text-body-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none" placeholder="惣菜パン" type="text"/>
</div>
</div>
<!-- Category Chips -->
<div class="space-y-sm">
<label class="font-label-bold text-label-bold text-primary block">カテゴリ</label>
<div class="flex flex-wrap gap-sm">
<button class="px-md py-sm bg-primary text-on-primary font-label-bold rounded-full border border-primary transition-all active:scale-95">恋愛</button>
<button class="px-md py-sm bg-surface-container-lowest text-primary border-2 border-primary font-label-bold rounded-full transition-all hover:bg-surface-variant active:scale-95">食</button>
<button class="px-md py-sm bg-surface-container-lowest text-primary border-2 border-primary font-label-bold rounded-full transition-all hover:bg-surface-variant active:scale-95">ネタ</button>
<button class="px-md py-sm bg-surface-container-lowest text-primary border-2 border-primary font-label-bold rounded-full transition-all hover:bg-surface-variant active:scale-95">仕事</button>
<button class="px-md py-sm bg-surface-container-lowest text-primary border-2 border-primary font-label-bold rounded-full transition-all hover:bg-surface-variant active:scale-95">ライフスタイル</button>
</div>
</div>
<!-- Panda Message Card -->
<div class="bg-surface-container-low border border-outline-variant p-lg rounded-xl flex items-start gap-md relative overflow-hidden">
<div class="flex-1 space-y-xs">
<span class="inline-block bg-primary text-on-primary px-sm py-1 rounded-sm text-[10px] font-bold">PANDA TIPS</span>
<p class="font-body-lg text-body-lg text-primary leading-tight">「面白い二択を待ってるよ。誰も選べないような究極のやつを頼むよ！」</p>
</div>
<div class="w-24 h-24 flex-shrink-0">
<img alt="Supporting Panda" class="w-full h-full object-contain" data-alt="A clean, minimalist black and white line art illustration of a cheerful panda character. The panda is leaning forward with a supportive and encouraging expression, looking directly at the viewer. The background is a flat, soft grey, creating a high-contrast and modern aesthetic consistent with a premium mobile UI. The lighting is even and bright, emphasizing the crisp edges and playful personality of the character." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCxJGl1zxusVpu7Vohz28hHW3E3FsLwpPWolQE7SQzUnm8Jve59dd96qahjoT3YzstRsuptDrVmJdw3Yw8gUTyAQD2D315kkZ6J91yychNe_aMvosFoXdKdS8U4THoavw3Q7OiTOZgNhTZhwo43McKxc6-W0sjo6hQuyC9uKEXeNkpPGh-9HlvUBPKYtJuthKCQMayOfa9YSfAqg7E17Aowa7HHhrsHMldKlirZhbVpHR1h_bGIH7CpJrlcoi8TGeQ5HthsEsFztxw"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-lg rounded-xl transition-all hover:opacity-90 active:scale-[0.98] shadow-lg">
                投稿する
            </button>
</div>
</main>

<span class="font-label-bold text-label-bold">投稿</span>
</a>

<span class="material-symbols-outlined" data-icon="forum">forum</span>
<span class="font-label-bold text-label-bold">トーク</span>
</a>

<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-bold text-label-bold">プロフ</span>
</a>
</nav>
